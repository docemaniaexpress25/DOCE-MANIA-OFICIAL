<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>input,select{outline:none}body{font-family:system-ui,sans-serif}</style></head>
<body class="bg-gray-500">
<div class="fixed inset-0 bg-black/50 backdrop-blur-sm z-[200] flex items-center justify-center p-3 sm:p-6"><div class="bg-white w-full max-w-md rounded-[2rem] p-5 sm:p-8 shadow-2xl overflow-y-auto max-h-[90vh]"><h3 class="font-black text-gray-800 uppercase text-sm mb-6 text-center">Editar Produto</h3><div class="space-y-4">
<div class="space-y-1"><label class="text-[9px] font-black text-gray-400 uppercase ml-1">Estoque Central</label><input value="567" class="w-full p-4 bg-gray-50 border rounded-2xl font-bold"></div>
<div class="bg-indigo-50 border border-indigo-100 rounded-2xl p-3 sm:p-4 space-y-3">
  <p class="text-[9px] font-black text-indigo-600 uppercase tracking-widest flex items-center gap-1"><i class="fa-solid fa-file-invoice"></i> Dados Fiscais (NF-e / NFC-e)</p>
  <div class="grid grid-cols-2 gap-2 sm:gap-3">
    <div class="space-y-1"><label class="text-[9px] font-black text-gray-400 uppercase ml-1">NCM *</label><input value="21069090" inputMode="numeric" class="w-full p-3.5 bg-white border rounded-2xl font-bold text-base min-w-0"></div>
    <div class="space-y-1"><label class="text-[9px] font-black text-gray-400 uppercase ml-1">CFOP *</label><input value="5102" inputMode="numeric" class="w-full p-3.5 bg-white border rounded-2xl font-bold text-base min-w-0"></div>
  </div>
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 sm:gap-3">
    <div class="space-y-1"><label class="text-[9px] font-black text-gray-400 uppercase ml-1">CEST (se houver ST)</label><input placeholder="Ex: 12.001.00" inputMode="numeric" class="w-full p-3.5 bg-white border rounded-2xl font-bold text-base min-w-0"></div>
    <div class="space-y-1"><label class="text-[9px] font-black text-gray-400 uppercase ml-1">EAN (cód. barras)</label><input value="7891234567890" inputMode="numeric" class="w-full p-3.5 bg-white border rounded-2xl font-bold text-base min-w-0"></div>
  </div>
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 sm:gap-3">
    <div class="space-y-1"><label class="text-[9px] font-black text-gray-400 uppercase ml-1">Unidade</label><select class="w-full p-3.5 bg-white border rounded-2xl font-bold text-base min-w-0"><option>UN</option></select></div>
    <div class="space-y-1"><label class="text-[9px] font-black text-gray-400 uppercase ml-1">Origem</label><select class="w-full p-3.5 bg-white border rounded-2xl font-bold text-base min-w-0"><option>0 — Nacional</option><option>1 — Estr. (imp. direta)</option><option>2 — Estr. (merc. interno)</option><option>3 — Nac. imp. &lt; 40%</option><option>7 — Nac. sem imp.</option></select></div>
  </div>
  <p class="text-[8px] font-bold text-indigo-400 leading-snug">* NCM e CFOP são os principais para a nota sair sem rejeição.</p>
</div>
<div class="flex items-center gap-2 py-2"><input type="checkbox" checked class="w-5 h-5"><label class="text-xs font-bold text-gray-700 uppercase">Produto Ativo</label></div>
<button class="w-full bg-blue-600 text-white font-black py-4 rounded-2xl shadow-xl uppercase text-xs tracking-widest">Salvar Produto</button>
</div></div></div>
</body></html>
